<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Micra-Cam</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; }
canvas { position:fixed; top:0; left:0; display:block; }

#hud {
  position:fixed; top:12px; left:12px;
  font:12px/1.8 monospace; color:#0ff;
  background:rgba(0,0,0,0.5); padding:6px 10px;
  pointer-events:none;
}

/* 起動ボタン（WebXRはユーザー操作が必須） */
#start-screen {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.85);
}
#start-screen h1 {
  font:bold 28px monospace; color:#0f0;
  text-shadow:0 0 12px #0f0;
  margin-bottom:8px; letter-spacing:2px;
}
#start-screen p {
  font:13px monospace; color:#aaa;
  margin-bottom:40px; text-align:center; line-height:1.7;
}
#start-btn {
  padding:18px 48px; font:bold 18px monospace;
  color:#fff; background:#1a6a1a;
  border:2px solid #3f3; border-radius:4px;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
#start-btn:active { background:#0a4a0a; }

#error {
  position:fixed; inset:0;
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.9);
  font:13px monospace; color:#f66;
  text-align:center; padding:24px; line-height:2;
}

/* 十字照準 */
#crosshair {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:20px; height:20px;
  pointer-events:none; display:none;
}
#crosshair::before,#crosshair::after {
  content:''; position:absolute; background:rgba(255,255,255,0.7);
}
#crosshair::before { width:2px; height:100%; left:50%; transform:translateX(-50%); }
#crosshair::after  { height:2px; width:100%; top:50%;  transform:translateY(-50%); }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="hud" style="display:none">
  BLOCKS: <span id="n">0</span><br>
  DEPTH:  <span id="d">--</span> m<br>
  FPS:    <span id="f">--</span>
</div>
<div id="crosshair"></div>

<div id="start-screen">
  <h1>MICRA-CAM</h1>
  <p>LiDAR で空間をスキャンして<br>マイクラ風ブロックに変換します</p>
  <button id="start-btn">AR スキャン開始</button>
  <p id="compat" style="margin-top:20px;font:11px monospace;color:#666"></p>
</div>

<div id="error"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
'use strict';

// ─── エラーハンドラ ───────────────────────────────────────────
window.onerror = function(m,s,l){ showError('JS Error (L'+l+'):\n'+m); };
window.addEventListener('unhandledrejection', function(e){
  showError('Error:\n' + (e.reason && e.reason.message || String(e.reason)));
});

function showError(msg) {
  var el = document.getElementById('error');
  el.innerHTML = msg.replace(/\n/g,'<br>');
  el.style.display = 'flex';
}

// ─── ライブラリ確認 ───────────────────────────────────────────
if (typeof THREE === 'undefined') {
  showError('Three.js 読み込み失敗\nネット接続を確認してください');
}

// ─── 定数 ─────────────────────────────────────────────────────
var VOXEL   = 0.20;   // 20 cm
var MAX_V   = 4000;
var SKIP    = 6;      // 深度マップのサンプリング間隔（px）
var PERIOD  = 100;    // スキャン間隔 (ms)

// ─── テクスチャ生成 ───────────────────────────────────────────
function lcg(seed) {
  var s = seed | 0;
  return function() {
    s = (Math.imul(s, 1664525) + 1013904223) | 0;
    return (s >>> 0) / 0x100000000;
  };
}

function makeTex(fn) {
  var c = document.createElement('canvas');
  c.width = c.height = 16;
  fn(c.getContext('2d'));
  var t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  return t;
}

function buildTextures() {
  var r1=lcg(1), r2=lcg(2), r3=lcg(3), r4=lcg(4), r5=lcg(5),
      r6=lcg(6), r7=lcg(7), r8=lcg(8), r9=lcg(9);

  return {
    grassTop: makeTex(function(ctx) {
      var pal = [[73,142,36],[58,128,28],[85,155,44],[66,135,32]];
      for (var y=0;y<16;y++) for (var x=0;x<16;x++) {
        var c = pal[r1()*4|0];
        ctx.fillStyle = 'rgb('+c[0]+','+c[1]+','+c[2]+')';
        ctx.fillRect(x,y,1,1);
      }
    }),
    grassSide: makeTex(function(ctx) {
      for (var y=4;y<16;y++) for (var x=0;x<16;x++) {
        var v = 100+r2()*40;
        ctx.fillStyle = 'rgb('+(v*.75|0)+','+(v*.52|0)+','+(v*.32|0)+')';
        ctx.fillRect(x,y,1,1);
      }
      for (var y=0;y<4;y++) for (var x=0;x<16;x++) {
        var v = r3();
        ctx.fillStyle = 'rgb('+(60+v*25|0)+','+(132+v*22|0)+','+(28+v*16|0)+')';
        ctx.fillRect(x,y,1,1);
      }
    }),
    dirt: makeTex(function(ctx) {
      for (var y=0;y<16;y++) for (var x=0;x<16;x++) {
        var v = 108+r4()*38;
        ctx.fillStyle = 'rgb('+(v*.75|0)+','+(v*.52|0)+','+(v*.32|0)+')';
        ctx.fillRect(x,y,1,1);
      }
    }),
    stone: makeTex(function(ctx) {
      for (var y=0;y<16;y++) for (var x=0;x<16;x++) {
        var v = 118+r5()*26;
        ctx.fillStyle = 'rgb('+v+','+v+','+v+')';
        ctx.fillRect(x,y,1,1);
      }
      ctx.strokeStyle = 'rgba(70,70,70,0.7)';
      ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(2,1); ctx.lineTo(5,5); ctx.lineTo(9,4); ctx.lineTo(12,8);
      ctx.moveTo(0,10); ctx.lineTo(4,13); ctx.lineTo(8,11); ctx.lineTo(13,15);
      ctx.stroke();
    }),
    brick: makeTex(function(ctx) {
      ctx.fillStyle = '#7a7a7a'; ctx.fillRect(0,0,16,16);
      var bp = [[160,60,38],[148,55,33],[172,66,42]];
      for (var row=0;row<4;row++) {
        var off = (row&1)*4;
        for (var col=-1;col<4;col++) {
          var c = bp[r6()*3|0];
          ctx.fillStyle = 'rgb('+c[0]+','+c[1]+','+c[2]+')';
          ctx.fillRect(col*8+off, row*4, 7, 3);
        }
      }
    }),
    sand: makeTex(function(ctx) {
      for (var y=0;y<16;y++) for (var x=0;x<16;x++) {
        var v = 208+r7()*28;
        ctx.fillStyle = 'rgb('+(v|0)+','+(v*.94|0)+','+(v*.62|0)+')';
        ctx.fillRect(x,y,1,1);
      }
    }),
    wood: makeTex(function(ctx) {
      for (var y=0;y<16;y++) {
        var base = 145+Math.floor(y/4)*8;
        for (var x=0;x<16;x++) {
          var v = base+r8()*16-8;
          ctx.fillStyle = 'rgb('+(v*.72|0)+','+(v*.52|0)+','+(v*.26|0)+')';
          ctx.fillRect(x,y,1,1);
        }
        if (y%4===0) { ctx.fillStyle='rgba(70,40,10,0.4)'; ctx.fillRect(0,y,16,1); }
      }
    }),
    leaf: makeTex(function(ctx) {
      for (var y=0;y<16;y++) for (var x=0;x<16;x++) {
        if (r9() > 0.12) {
          var v = 40+r9()*55;
          ctx.fillStyle = 'rgb('+(v*.5|0)+','+(v|0)+','+(v*.3|0)+')';
          ctx.fillRect(x,y,1,1);
        }
      }
    })
  };
}

// ─── マテリアル生成 ───────────────────────────────────────────
function buildMaterials(tex) {
  function lm(key) {
    return new THREE.MeshLambertMaterial({ map: tex[key] });
  }
  return {
    grass: [ lm('grassSide'), lm('grassSide'), lm('grassTop'),
             lm('dirt'),      lm('grassSide'), lm('grassSide') ],
    stone: [ lm('stone'), lm('stone'), lm('stone'),
             lm('stone'), lm('stone'), lm('stone') ],
    dirt:  [ lm('dirt'), lm('dirt'), lm('dirt'),
             lm('dirt'), lm('dirt'), lm('dirt') ],
    sand:  [ lm('sand'), lm('sand'), lm('sand'),
             lm('sand'), lm('sand'), lm('sand') ],
    brick: [ lm('brick'), lm('brick'), lm('brick'),
             lm('brick'), lm('brick'), lm('brick') ],
    wood:  [ lm('wood'), lm('wood'), lm('wood'),
             lm('wood'), lm('wood'), lm('wood') ],
    leaf:  [ lm('leaf'), lm('leaf'), lm('leaf'),
             lm('leaf'), lm('leaf'), lm('leaf') ]
  };
}

// ─── ボクセル管理 ─────────────────────────────────────────────
var voxelSet  = {};  // "ix|iy|iz" -> true
var voxelMesh = {};  // "ix|iy|iz" -> Mesh
var voxelCount = 0;

function vkey(ix,iy,iz) { return ix+'|'+iy+'|'+iz; }

function worldToIdx(wx,wy,wz) {
  return [Math.round(wx/VOXEL), Math.round(wy/VOXEL), Math.round(wz/VOXEL)];
}

function blockType(ix,iy,iz) {
  // 表面（上が空）→ 草、それ以外 → 石
  return voxelSet[vkey(ix, iy+1, iz)] ? 'stone' : 'grass';
}

function addVoxel(wx,wy,wz, scene,geo,mats) {
  if (voxelCount >= MAX_V) return;
  var idx = worldToIdx(wx,wy,wz);
  var ix=idx[0], iy=idx[1], iz=idx[2];
  var k = vkey(ix,iy,iz);
  if (voxelSet[k]) return;

  voxelSet[k] = true;
  voxelCount++;

  var type = blockType(ix,iy,iz);
  var mesh = new THREE.Mesh(geo, mats[type]);
  mesh.position.set(ix*VOXEL, iy*VOXEL, iz*VOXEL);
  scene.add(mesh);
  voxelMesh[k] = mesh;

  // 下のブロックの表面タイプを更新
  var belowKey = vkey(ix,iy-1,iz);
  if (voxelMesh[belowKey]) {
    voxelMesh[belowKey].material = mats[blockType(ix,iy-1,iz)];
  }

  document.getElementById('n').textContent = voxelCount;
}

// ─── 深度データ処理 ───────────────────────────────────────────
var _invProj = new THREE.Matrix4();
var _camMat  = new THREE.Matrix4();
var _v4      = new THREE.Vector4();
var _v3      = new THREE.Vector3();

function processDepth(depthInfo, view, scene, geo, mats) {
  var dw = depthInfo.width;
  var dh = depthInfo.height;

  _invProj.fromArray(view.projectionMatrix).invert();
  _camMat.fromArray(view.transform.matrix);

  var centerDepth = depthInfo.getDepthInMeters(0.5, 0.5);
  if (isFinite(centerDepth)) {
    document.getElementById('d').textContent = centerDepth.toFixed(2);
  }

  for (var py = 0; py < dh; py += SKIP) {
    for (var px = 0; px < dw; px += SKIP) {
      var u = (px + 0.5) / dw;
      var v = (py + 0.5) / dh;
      var depth = depthInfo.getDepthInMeters(u, v);

      if (!isFinite(depth) || depth < 0.15 || depth > 5.0) continue;

      // NDC → ビュー空間方向ベクトル
      var ndcX =  u * 2 - 1;
      var ndcY = -(v * 2 - 1);
      _v4.set(ndcX, ndcY, -1, 1).applyMatrix4(_invProj);
      _v3.set(_v4.x/_v4.w, _v4.y/_v4.w, _v4.z/_v4.w).normalize();
      _v3.multiplyScalar(depth);

      // ビュー → ワールド
      _v4.set(_v3.x, _v3.y, _v3.z, 1).applyMatrix4(_camMat);
      addVoxel(_v4.x, _v4.y, _v4.z, scene, geo, mats);
    }
  }
}

// ─── メインアプリ ─────────────────────────────────────────────
var renderer, scene, camera, refSpace;
var lastScan = 0;
var frameN = 0, lastFpsT = 0;

function startApp() {
  // Three.js セットアップ
  var canvas = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 30);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  var sun = new THREE.DirectionalLight(0xfffae0, 0.5);
  sun.position.set(3, 5, 2);
  scene.add(sun);

  var tex  = buildTextures();
  var mats = buildMaterials(tex);
  var geo  = new THREE.BoxGeometry(VOXEL, VOXEL, VOXEL);

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // WebXR AR セッション開始
  var opts = {
    requiredFeatures: ['local-floor'],
    optionalFeatures: ['depth-sensing'],
    depthSensing: {
      usagePreference:      ['cpu-optimized'],
      dataFormatPreference: ['luminance-alpha']
    }
  };

  navigator.xr.requestSession('immersive-ar', opts)
    .catch(function() {
      // depth-sensing なしで再試行
      return navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local-floor']
      });
    })
    .then(function(session) {
      var hasDepth = !!session.depthUsage;

      renderer.xr.setReferenceSpaceType('local-floor');
      return renderer.xr.setSession(session).then(function() {
        return session.requestReferenceSpace('local-floor')
          .catch(function() { return session.requestReferenceSpace('local'); });
      }).then(function(rs) {
        refSpace = rs;

        // UI 切り替え
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('crosshair').style.display = 'block';

        if (!hasDepth) {
          document.getElementById('d').textContent = 'LiDAR 無効';
        }

        session.addEventListener('end', function() {
          document.getElementById('start-screen').style.display = 'flex';
          document.getElementById('hud').style.display = 'none';
          document.getElementById('crosshair').style.display = 'none';
        });

        renderer.setAnimationLoop(function(time, frame) {
          // FPS カウント
          frameN++;
          if (time - lastFpsT > 1000) {
            document.getElementById('f').textContent = frameN;
            frameN = 0; lastFpsT = time;
          }

          if (frame && refSpace && hasDepth && (time - lastScan) > PERIOD) {
            lastScan = time;
            var pose = frame.getViewerPose(refSpace);
            if (pose) {
              for (var i = 0; i < pose.views.length; i++) {
                var view = pose.views[i];
                var di = frame.getDepthInformation && frame.getDepthInformation(view);
                if (di) processDepth(di, view, scene, geo, mats);
              }
            }
          }

          renderer.render(scene, camera);
        });
      });
    })
    .catch(function(e) {
      showError('AR 開始に失敗しました\n\n' + e.message + '\n\n※ Safari で開いてください\n※ iOS 16 以上が必要です');
    });
}

// ─── 起動ボタン ───────────────────────────────────────────────
function onStart() {
  document.getElementById('start-btn').disabled = true;
  document.getElementById('start-btn').textContent = '起動中...';

  if (typeof THREE === 'undefined') {
    showError('Three.js 読み込み失敗'); return;
  }
  if (!navigator.xr) {
    showError('WebXR 非対応です\nSafari 16+ で開いてください'); return;
  }

  navigator.xr.isSessionSupported('immersive-ar').then(function(ok) {
    if (!ok) {
      showError('AR セッション非対応\niPhone 12 Pro 以降の\nSafari で試してください');
      return;
    }
    startApp();
  }).catch(function(e) {
    showError('確認エラー: ' + e.message);
  });
}

document.getElementById('start-btn').addEventListener('click', onStart);

// ─── 互換性表示 ───────────────────────────────────────────────
(function checkCompat() {
  var lines = [];
  if (typeof THREE !== 'undefined') lines.push('✅ Three.js');
  else lines.push('❌ Three.js 未読込');
  if (navigator.xr) lines.push('✅ WebXR あり');
  else lines.push('❌ WebXR なし (Safari で開いてください)');
  document.getElementById('compat').innerHTML = lines.join(' &nbsp; ');
})();
</script>
</body>
</html>
