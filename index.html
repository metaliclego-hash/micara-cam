<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Micra-Cam</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:monospace; }

/* カメラ映像（背景） */
#cam {
  position:fixed; top:0; left:0;
  width:100%; height:100%; object-fit:cover;
  z-index:0;
}
/* Three.js（透明でカメラの上） */
#cvs { position:fixed; top:0; left:0; z-index:1; display:block; }

/* 情報 */
#hud {
  position:fixed; top:10px; left:10px; z-index:20;
  font:11px/2 monospace; color:#0ff;
  background:rgba(0,0,0,0.5); padding:6px 10px;
  pointer-events:none;
}
/* 照準 */
#aim {
  position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%);
  z-index:20; pointer-events:none;
}
#aim::before,#aim::after { content:''; position:absolute; background:rgba(255,255,255,.7); }
#aim::before { width:1px; height:28px; left:50%; transform:translateX(-50%); }
#aim::after  { height:1px; width:28px; top:50%;  transform:translateY(-50%); }

/* ARで見るボタン */
#ar-btn {
  position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
  z-index:20;
  padding:14px 36px; font:bold 15px monospace;
  color:#fff; background:#1a4a8a;
  border:2px solid #4af; border-radius:6px;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  display:none;
}
/* Quick Look リンク（非表示） */
#ar-link { display:none; }

/* 生成中オーバーレイ */
#gen {
  position:fixed; inset:0; z-index:30; display:none;
  background:rgba(0,0,0,.8); flex-direction:column;
  align-items:center; justify-content:center;
  font:14px monospace; color:#5EE; text-align:center; line-height:2;
}

/* スタート画面 */
#boot {
  position:fixed; inset:0; z-index:40;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:#000; padding:24px;
}
#boot h1 { font-size:26px; color:#0f0; text-shadow:0 0 10px #0f0; margin-bottom:8px; letter-spacing:3px; }
#boot p  { font-size:12px; color:#666; text-align:center; line-height:1.9; margin-bottom:32px; }
#boot-btn {
  padding:16px 44px; font:bold 17px monospace; color:#fff;
  background:#1a5a1a; border:2px solid #3a3; border-radius:4px;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
#boot-note { margin-top:18px; font:10px monospace; color:#444; text-align:center; line-height:2; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="cvs"></canvas>

<div id="hud">
  BLOCKS: <span id="bcnt">0</span><br>
  FPS: <span id="fps">--</span>
</div>
<div id="aim"></div>

<!-- ARで見るボタン + 非表示リンク -->
<button id="ar-btn">🥽 ARで見る</button>
<a id="ar-link" rel="ar" href="#"></a>

<!-- USDZ生成中 -->
<div id="gen">USDZ 生成中...<br><span id="gen-n">0</span> ブロック</div>

<!-- スタート画面 -->
<div id="boot">
  <h1>MICRA-CAM</h1>
  <p>カメラで空間をスキャンして<br>マイクラ風ブロックに変換し<br>Quick Look AR で見ます</p>
  <button id="boot-btn">スキャン開始</button>
  <div id="boot-note"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
'use strict';

// ── 定数 ──────────────────────────────────────────────────
var VS       = 0.20;   // ボクセルサイズ 20cm
var MAX_V    = 3000;   // 最大ブロック数
var SCAN_MS  = 80;     // スキャン間隔

// ── テクスチャ ────────────────────────────────────────────
function lcg(s) { return function(){ s=(Math.imul(s,1664525)+1013904223)|0; return (s>>>0)/0x100000000; }; }
function mktex(fn) {
  var c=document.createElement('canvas'); c.width=c.height=16;
  fn(c.getContext('2d'));
  var t=new THREE.CanvasTexture(c);
  t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; t.generateMipmaps=false;
  return t;
}
function buildTex(){
  var r1=lcg(1),r2=lcg(2),r3=lcg(3),r4=lcg(4),r5=lcg(5),r6=lcg(6);
  return {
    gt:mktex(function(c){ var p=[[73,142,36],[58,128,28],[85,155,44],[66,135,32]]; for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=p[r1()*4|0];c.fillStyle='rgb('+v[0]+','+v[1]+','+v[2]+')';c.fillRect(x,y,1,1);} }),
    gs:mktex(function(c){ for(var y=4;y<16;y++) for(var x=0;x<16;x++){var v=100+r2()*40;c.fillStyle='rgb('+(v*.75|0)+','+(v*.52|0)+','+(v*.32|0)+')';c.fillRect(x,y,1,1);} for(var y=0;y<4;y++) for(var x=0;x<16;x++){var v=r3();c.fillStyle='rgb('+(60+v*25|0)+','+(132+v*22|0)+','+(28+v*16|0)+')';c.fillRect(x,y,1,1);} }),
    di:mktex(function(c){ for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=108+r4()*38;c.fillStyle='rgb('+(v*.75|0)+','+(v*.52|0)+','+(v*.32|0)+')';c.fillRect(x,y,1,1);} }),
    st:mktex(function(c){ for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=118+r5()*26;c.fillStyle='rgb('+v+','+v+','+v+')';c.fillRect(x,y,1,1);} c.strokeStyle='rgba(70,70,70,.7)';c.lineWidth=1;c.beginPath();c.moveTo(2,1);c.lineTo(5,5);c.lineTo(9,4);c.lineTo(12,8);c.moveTo(0,10);c.lineTo(4,13);c.lineTo(8,11);c.lineTo(13,15);c.stroke(); }),
    sa:mktex(function(c){ for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=208+r6()*28;c.fillStyle='rgb('+(v|0)+','+(v*.94|0)+','+(v*.62|0)+')';c.fillRect(x,y,1,1);} })
  };
}
function buildMats(tx){
  function lm(k){ return new THREE.MeshLambertMaterial({map:tx[k]}); }
  return {
    grass:[lm('gs'),lm('gs'),lm('gt'),lm('di'),lm('gs'),lm('gs')],
    stone:[lm('st'),lm('st'),lm('st'),lm('st'),lm('st'),lm('st')],
    dirt: [lm('di'),lm('di'),lm('di'),lm('di'),lm('di'),lm('di')],
    sand: [lm('sa'),lm('sa'),lm('sa'),lm('sa'),lm('sa'),lm('sa')]
  };
}

// ── ボクセル ──────────────────────────────────────────────
var vset={}, vmsh={}, vcnt=0;
var scene, geo, mats;

function vk(ix,iy,iz){ return ix+'|'+iy+'|'+iz; }
function w2i(w){ return [Math.round(w[0]/VS), Math.round(w[1]/VS), Math.round(w[2]/VS)]; }
function btype(ix,iy,iz){ return vset[vk(ix,iy+1,iz)] ? 'stone' : 'grass'; }

function addVox(wx,wy,wz){
  if(vcnt>=MAX_V) return;
  var i=w2i([wx,wy,wz]), ix=i[0],iy=i[1],iz=i[2], k=vk(ix,iy,iz);
  if(vset[k]) return;
  vset[k]=1; vcnt++;
  var m=new THREE.Mesh(geo, mats[btype(ix,iy,iz)]);
  m.position.set(ix*VS, iy*VS, iz*VS);
  scene.add(m); vmsh[k]=m;
  var bk=vk(ix,iy-1,iz);
  if(vmsh[bk]) vmsh[bk].material=mats[btype(ix,iy-1,iz)];
  document.getElementById('bcnt').textContent=vcnt;
  if(vcnt>=50 && arBtn.style.display==='none') arBtn.style.display='block';
}

// ── Three.js ─────────────────────────────────────────────
var renderer, camera;
var arBtn = document.getElementById('ar-btn');

function initThree(){
  var cvs=document.getElementById('cvs');
  renderer=new THREE.WebGLRenderer({canvas:cvs, antialias:false, alpha:true});
  renderer.setClearColor(0,0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.01,40);
  camera.position.set(0,0,0);

  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  var sun=new THREE.DirectionalLight(0xfffae0,0.5); sun.position.set(3,5,2); scene.add(sun);

  var tx=buildTex(); mats=buildMats(tx);
  geo=new THREE.BoxGeometry(VS,VS,VS);

  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
}

// ── ジャイロ →カメラ回転 ─────────────────────────────────
var _qFix=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
var _qE=new THREE.Euler(), _q0=new THREE.Quaternion();

function onGyro(e){
  if(!e.alpha&&!e.beta&&!e.gamma) return;
  _qE.set(e.beta*(Math.PI/180), e.alpha*(Math.PI/180), -e.gamma*(Math.PI/180), 'YXZ');
  _q0.setFromEuler(_qE).multiply(_qFix);
  camera.quaternion.copy(_q0);
}
function startGyro(){
  if(typeof DeviceOrientationEvent==='undefined') return Promise.resolve();
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    return DeviceOrientationEvent.requestPermission()
      .then(function(s){ if(s==='granted') window.addEventListener('deviceorientation',onGyro,true); })
      .catch(function(){});
  }
  window.addEventListener('deviceorientation',onGyro,true);
  return Promise.resolve();
}

// ── 自動スキャン（カメラが向いている方向へボクセル配置）────
// カメラ向きに合わせて複数距離でサンプリング
// → 部屋の壁面に相当する位置にブロックが積まれていく
var OFFSETS=[[0,0],[.04,0],[-.04,0],[0,.04],[0,-.04],[.08,0],[-.08,0],[0,.08],[0,-.08]];
var DISTS=[0.6,1.0,1.5,2.0,2.8,3.5,4.2]; // 複数距離を試す

function autoScan(){
  for(var i=0;i<OFFSETS.length;i++){
    var d=new THREE.Vector3(OFFSETS[i][0],OFFSETS[i][1],-1)
            .applyQuaternion(camera.quaternion).normalize();
    // 全距離ではなく確率的に1距離だけ選ぶ（密度を保つ）
    var dist=DISTS[Math.floor(Math.random()*DISTS.length)];
    dist+=(Math.random()-.5)*0.1;
    addVox(d.x*dist, d.y*dist, d.z*dist);
  }
}

// ── スキャン開始フロー ────────────────────────────────────
function startScan(){
  initThree();

  // カメラ映像
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:{exact:'environment'},width:{ideal:1280},height:{ideal:720}},
    audio:false
  }).catch(function(){
    return navigator.mediaDevices.getUserMedia({video:true,audio:false});
  }).then(function(stream){
    document.getElementById('cam').srcObject=stream;
    return startGyro();
  }).then(function(){
    // スタート画面を消す
    document.getElementById('boot').style.display='none';

    // レンダリングループ
    var fn=0,ft=0;
    var lastS=0;
    function loop(t){
      fn++; if(t-ft>1000){document.getElementById('fps').textContent=fn;fn=0;ft=t;}
      if(t-lastS>SCAN_MS){ lastS=t; autoScan(); }
      renderer.render(scene,camera);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

  }).catch(function(e){
    document.getElementById('boot-note').textContent='カメラエラー: '+e.message;
    document.getElementById('boot-btn').disabled=false;
    document.getElementById('boot-btn').textContent='スキャン開始';
  });
}

// ── USDZ 生成 → Quick Look AR ────────────────────────────
var blobUrl=null;

function makeUSDA(){
  var keys=Object.keys(vset);
  if(!keys.length) return null;

  // Y最小値（床 = Y=0 になるよう調整）
  var minY=Infinity;
  keys.forEach(function(k){ var p=k.split('|'); var y=parseInt(p[1]); if(y<minY) minY=y; });

  var matDefs=[
    {name:'GrassMat', r:.36,g:.56,b:.14},
    {name:'StoneMat', r:.46,g:.46,b:.46},
    {name:'DirtMat',  r:.55,g:.38,b:.22},
    {name:'SandMat',  r:.82,g:.74,b:.40}
  ];
  var typeToMat={grass:'GrassMat',stone:'StoneMat',dirt:'DirtMat',sand:'SandMat'};

  var L=[
    '#usda 1.0',
    '(','    defaultPrim = "Root"','    metersPerUnit = 1.0','    upAxis = "Y"',')',
    '','def Xform "Root"','{'
  ];

  keys.forEach(function(k,i){
    var p=k.split('|');
    var ix=parseInt(p[0]),iy=parseInt(p[1]),iz=parseInt(p[2]);
    var wx=(ix*VS).toFixed(3);
    var wy=((iy-minY)*VS+VS*.5).toFixed(3);
    var wz=(iz*VS).toFixed(3);
    var bt=btype(ix,iy,iz);
    var mn=typeToMat[bt]||'StoneMat';
    L.push(
      '    def Cube "B'+i+'"',
      '    {',
      '        double size = '+VS,
      '        double3 xformOp:translate = ('+wx+','+wy+','+wz+')',
      '        uniform token[] xformOpOrder = ["xformOp:translate"]',
      '        rel material:binding = </Root/'+mn+'>',
      '    }'
    );
  });

  matDefs.forEach(function(m){
    L.push(
      '    def Material "'+m.name+'"',
      '    {',
      '        token outputs:surface.connect = </Root/'+m.name+'/S.outputs:surface>',
      '        def Shader "S"',
      '        {',
      '            uniform token info:id = "UsdPreviewSurface"',
      '            color3f inputs:diffuseColor = ('+m.r.toFixed(3)+','+m.g.toFixed(3)+','+m.b.toFixed(3)+')',
      '            float inputs:roughness = 0.9',
      '            float inputs:metallic = 0.0',
      '            token outputs:surface',
      '        }',
      '    }'
    );
  });
  L.push('}');
  return L.join('\n');
}

arBtn.addEventListener('click',function(){
  var n=vcnt;
  if(!n){ alert('まずスキャンしてください'); return; }

  var genEl=document.getElementById('gen');
  document.getElementById('gen-n').textContent=n;
  genEl.style.display='flex';

  setTimeout(function(){
    try{
      var usda=makeUSDA();
      var zip=new JSZip();
      zip.file('scene.usda', usda, {compression:'STORE'});
      zip.generateAsync({type:'arraybuffer',compression:'STORE'}).then(function(buf){
        var blob=new Blob([buf],{type:'model/vnd.usdz+zip'});
        if(blobUrl) URL.revokeObjectURL(blobUrl);
        blobUrl=URL.createObjectURL(blob);
        var link=document.getElementById('ar-link');
        link.href=blobUrl;
        genEl.style.display='none';
        link.click(); // iOS Quick Look AR 起動
      });
    }catch(e){
      genEl.style.display='none';
      alert('生成エラー: '+e.message);
    }
  },50);
});

// ── 起動ボタン ───────────────────────────────────────────
// 起動時に診断表示
var note=[];
if(typeof THREE==='undefined') note.push('❌ Three.js 未読込');
if(typeof JSZip==='undefined') note.push('❌ JSZip 未読込');
if(!navigator.mediaDevices) note.push('⚠ カメラAPI なし');
document.getElementById('boot-note').innerHTML=note.join('<br>')||'✅ 準備完了';

document.getElementById('boot-btn').addEventListener('click',function(){
  this.disabled=true;
  this.textContent='起動中...';
  startScan();
});
</script>
</body>
</html>
