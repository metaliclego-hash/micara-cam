<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Micra-Cam | LiDAR × Minecraft</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; touch-action:none; font-family:'Press Start 2P',monospace; }

#main-canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; display:block; }

.layer { position:fixed; top:0; left:0; width:100%; height:100%; z-index:10; }

/* ── Start Screen ── */
#start-screen {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:linear-gradient(180deg,#1a6e9f 0%,#3399cc 40%,#87CEEB 65%,#5D8A2A 80%,#3f6014 100%);
}
.mc-logo {
  font-size:clamp(22px,7vw,56px); color:#FFFF00;
  text-shadow:4px 4px 0 #808000,6px 6px 0 rgba(0,0,0,0.35);
  letter-spacing:3px; z-index:1; user-select:none;
}
.mc-sub {
  font-size:clamp(7px,2vw,11px); color:#fff;
  text-shadow:2px 2px 0 #000; margin:10px 0 44px;
  z-index:1; text-align:center; line-height:2;
}
.mc-btn {
  display:block; width:clamp(220px,65vw,400px);
  padding:13px 10px; margin:5px 0;
  font-family:'Press Start 2P',monospace;
  font-size:clamp(9px,2.2vw,13px); color:#fff;
  text-shadow:2px 2px 0 rgba(0,0,0,0.6);
  background:#838383; border:none; cursor:pointer; text-align:center; z-index:1;
  border-top:3px solid #c6c6c6; border-left:3px solid #c6c6c6;
  border-right:3px solid #3d3d3d; border-bottom:3px solid #3d3d3d;
  -webkit-tap-highlight-color:transparent;
}
.mc-btn:active {
  border-top-color:#3d3d3d; border-left-color:#3d3d3d;
  border-right-color:#c6c6c6; border-bottom-color:#c6c6c6;
}
.mc-btn.green { background:#5a832a; border-top-color:#8fbf5a; border-left-color:#8fbf5a; border-right-color:#2a4a10; border-bottom-color:#2a4a10; }
.mc-btn.red   { background:#832a2a; border-top-color:#bf5a5a; border-left-color:#bf5a5a; border-right-color:#4a1010; border-bottom-color:#4a1010; }

#compat-info {
  font-size:7px; color:rgba(255,255,255,0.8); text-align:center;
  line-height:2.3; margin-top:18px; z-index:1; max-width:300px;
}

/* ── HUD ── */
#hud { display:none; pointer-events:none; }
#status-bar {
  position:absolute; top:16px; left:50%; transform:translateX(-50%);
  font-size:9px; color:#fff; background:rgba(0,0,0,0.6);
  border:2px solid rgba(255,255,255,0.25); padding:7px 14px; white-space:nowrap;
}
#lidar-badge {
  position:absolute; top:50px; left:50%; transform:translateX(-50%);
  font-size:7px; background:rgba(0,0,0,0.5); padding:4px 10px; color:#5EE;
}
#voxel-info {
  position:absolute; top:16px; left:12px;
  font-size:8px; color:#5EE; line-height:2.1;
  background:rgba(0,0,0,0.55); padding:8px 12px;
}
#crosshair {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:22px; height:22px;
}
#crosshair::before,#crosshair::after {
  content:''; position:absolute; background:rgba(255,255,255,0.85);
}
#crosshair::before { width:2px; height:100%; left:50%; transform:translateX(-50%); }
#crosshair::after  { height:2px; width:100%; top:50%; transform:translateY(-50%); }
#hud-controls {
  position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
  display:flex; gap:10px; pointer-events:all;
}

/* ── Error Screen ── */
#error-screen {
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,0.93); padding:24px;
}
#error-msg { font-size:9px; color:#F66; text-align:center; line-height:2.2; max-width:300px; margin-bottom:24px; }

/* pixel clouds */
@keyframes cloudMove { from{transform:translateX(-150px)} to{transform:translateX(110vw)} }
.cloud { position:absolute; background:#fff; opacity:0.88; border-radius:3px; }
</style>
</head>
<body>

<canvas id="main-canvas"></canvas>

<!-- Start Screen -->
<div class="layer" id="start-screen">
  <div id="cloud-container" style="position:absolute;top:0;left:0;right:0;height:60%;overflow:hidden;pointer-events:none;"></div>
  <div class="mc-logo">MICRA-CAM</div>
  <div class="mc-sub">LiDAR × MINECRAFT<br><span style="font-size:.75em;color:rgba(255,255,255,.7)">現実空間をマイクラ化</span></div>
  <button class="mc-btn green" id="btn-start">▶ AR スキャン開始</button>
  <button class="mc-btn"       id="btn-demo" >🎮 デモモード</button>
  <div id="compat-info">読込み中...</div>
</div>

<!-- HUD -->
<div class="layer" id="hud">
  <div id="status-bar">スキャン中...</div>
  <div id="lidar-badge">LiDAR: 待機中</div>
  <div id="voxel-info">
    BLOCKS: <span id="block-count">0</span><br>
    DEPTH: <span id="depth-val">--</span> m<br>
    FPS: <span id="fps-val">--</span>
  </div>
  <div id="crosshair"></div>
  <div id="hud-controls">
    <button class="mc-btn green" id="btn-toggle" style="font-size:8px;padding:10px">停止</button>
    <button class="mc-btn red"   id="btn-clear"  style="font-size:8px;padding:10px">クリア</button>
    <button class="mc-btn"       id="btn-exit"   style="font-size:8px;padding:10px">終了</button>
  </div>
</div>

<!-- Error Screen -->
<div class="layer" id="error-screen">
  <div id="error-msg"></div>
  <button class="mc-btn" id="btn-err-back">← 戻る</button>
</div>

<!-- Three.js (global build — no module import needed) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<script>
// ─── Global error catcher (shows errors in UI before app init) ───────────────
window.onerror = function(msg, src, line) {
  setCompat('❌ JS エラー<br>' + msg + '<br>line ' + line);
};
window.addEventListener('unhandledrejection', function(e) {
  setCompat('❌ 非同期エラー<br>' + (e.reason?.message || e.reason || '不明'));
});

function setCompat(html) {
  var el = document.getElementById('compat-info');
  if (el) el.innerHTML = html;
}
function showError(msg) {
  document.getElementById('error-msg').innerHTML = msg.replace(/\n/g,'<br>');
  document.getElementById('error-screen').style.display = 'flex';
}

// ─── Boot ────────────────────────────────────────────────────────────────────
// Wait for Three.js to be available
(function boot() {
  if (typeof THREE === 'undefined') {
    setCompat('❌ 3Dライブラリ読込み失敗<br>ネット接続を確認してください');
    return;
  }
  setCompat('✅ 3Dエンジン OK');
  initApp();
})();

// ─── TEXTURE GENERATION ──────────────────────────────────────────────────────
function makeTex(drawFn) {
  var c = document.createElement('canvas');
  c.width = c.height = 16;
  drawFn(c.getContext('2d'));
  var t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  return t;
}
function lcg(seed) {
  var s = seed | 0;
  return function() {
    s = (Math.imul(s, 1664525) + 1013904223) | 0;
    return (s >>> 0) / 0x100000000;
  };
}

var TEX;
function buildTextures() {
  function grassTop() {
    return makeTex(function(ctx) {
      var r=lcg(1), pal=[[73,142,36],[58,128,28],[85,155,44],[66,135,32]];
      for(var y=0;y<16;y++) for(var x=0;x<16;x++){var c=pal[r()*4|0];ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';ctx.fillRect(x,y,1,1);}
    });
  }
  function grassSide() {
    return makeTex(function(ctx) {
      var r=lcg(2),g=lcg(3);
      for(var y=4;y<16;y++) for(var x=0;x<16;x++){var v=100+r()*40;ctx.fillStyle='rgb('+(v*.75|0)+','+(v*.52|0)+','+(v*.32|0)+')';ctx.fillRect(x,y,1,1);}
      for(var y=0;y<4;y++) for(var x=0;x<16;x++){var v=g();ctx.fillStyle='rgb('+(63+v*22|0)+','+(135+v*20|0)+','+(30+v*14|0)+')';ctx.fillRect(x,y,1,1);}
    });
  }
  function dirt() {
    return makeTex(function(ctx) {
      var r=lcg(4);
      for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=108+r()*38;ctx.fillStyle='rgb('+(v*.75|0)+','+(v*.52|0)+','+(v*.32|0)+')';ctx.fillRect(x,y,1,1);}
    });
  }
  function stone() {
    return makeTex(function(ctx) {
      var r=lcg(5);
      for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=118+r()*26;ctx.fillStyle='rgb('+(v|0)+','+(v|0)+','+(v|0)+')';ctx.fillRect(x,y,1,1);}
      ctx.strokeStyle='rgba(70,70,70,0.7)';ctx.lineWidth=1;ctx.beginPath();
      ctx.moveTo(2,1);ctx.lineTo(5,5);ctx.lineTo(9,4);ctx.lineTo(12,8);
      ctx.moveTo(0,10);ctx.lineTo(4,13);ctx.lineTo(8,11);ctx.lineTo(13,15);
      ctx.stroke();
    });
  }
  function cobble() {
    return makeTex(function(ctx) {
      var r=lcg(6);
      for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=88+r()*32;ctx.fillStyle='rgb('+(v|0)+','+(v|0)+','+(v|0)+')';ctx.fillRect(x,y,1,1);}
      ctx.strokeStyle='rgba(50,50,50,0.8)';ctx.lineWidth=1;
      [[1,1,6,5],[8,0,6,4],[2,7,5,6],[9,6,6,5],[0,12,7,4],[8,12,7,4]].forEach(function(b){ctx.strokeRect(b[0]+.5,b[1]+.5,b[2],b[3]);});
    });
  }
  function brick() {
    return makeTex(function(ctx) {
      ctx.fillStyle='#7a7a7a';ctx.fillRect(0,0,16,16);
      var r=lcg(7),bp=[[160,60,38],[148,55,33],[172,66,42]];
      for(var row=0;row<4;row++){var off=(row&1)*4;for(var col=-1;col<4;col++){var c=bp[r()*3|0];ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';ctx.fillRect(col*8+off,row*4,7,3);}}
    });
  }
  function sand() {
    return makeTex(function(ctx) {
      var r=lcg(8);
      for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=208+r()*28;ctx.fillStyle='rgb('+(v|0)+','+(v*.94|0)+','+(v*.62|0)+')';ctx.fillRect(x,y,1,1);}
    });
  }
  function woodPlank() {
    return makeTex(function(ctx) {
      var r=lcg(9);
      for(var y=0;y<16;y++){var base=145+Math.floor(y/4)*8;for(var x=0;x<16;x++){var v=base+r()*16-8;ctx.fillStyle='rgb('+(v*.72|0)+','+(v*.52|0)+','+(v*.26|0)+')';ctx.fillRect(x,y,1,1);}if(y%4===0){ctx.fillStyle='rgba(70,40,10,.4)';ctx.fillRect(0,y,16,1);}}
    });
  }
  function leaf() {
    return makeTex(function(ctx) {
      var r=lcg(10);
      for(var y=0;y<16;y++) for(var x=0;x<16;x++){if(r()>0.12){var v=40+r()*55;ctx.fillStyle='rgb('+(v*.5|0)+','+(v|0)+','+(v*.3|0)+')';ctx.fillRect(x,y,1,1);}}
    });
  }
  function bedrock() {
    return makeTex(function(ctx) {
      var r=lcg(11);
      for(var y=0;y<16;y++) for(var x=0;x<16;x++){var v=40+r()*28;ctx.fillStyle='rgb('+(v|0)+','+(v|0)+','+(v|0)+')';ctx.fillRect(x,y,1,1);}
      ctx.fillStyle='rgba(0,0,0,.55)';
      [[2,2,3,2],[8,1,2,3],[13,3,2,2],[1,8,3,3],[7,9,2,2],[12,8,3,3]].forEach(function(b){ctx.fillRect(b[0],b[1],b[2],b[3]);});
    });
  }

  TEX = {
    grassTop:  grassTop(),
    grassSide: grassSide(),
    dirt:      dirt(),
    stone:     stone(),
    cobble:    cobble(),
    brick:     brick(),
    sand:      sand(),
    woodPlank: woodPlank(),
    leaf:      leaf(),
    bedrock:   bedrock(),
  };
}

// ─── MATERIALS ───────────────────────────────────────────────────────────────
var matCache = {};
function mat(key) {
  if (!matCache[key]) matCache[key] = new THREE.MeshLambertMaterial({ map: TEX[key] });
  return matCache[key];
}
function blockMats(type) {
  switch (type) {
    case 'grass':   return [mat('grassSide'),mat('grassSide'),mat('grassTop'),mat('dirt'),mat('grassSide'),mat('grassSide')];
    case 'dirt':    return [mat('dirt'),mat('dirt'),mat('dirt'),mat('dirt'),mat('dirt'),mat('dirt')];
    case 'stone':   return [mat('stone'),mat('stone'),mat('stone'),mat('stone'),mat('stone'),mat('stone')];
    case 'cobble':  return [mat('cobble'),mat('cobble'),mat('cobble'),mat('cobble'),mat('cobble'),mat('cobble')];
    case 'brick':   return [mat('brick'),mat('brick'),mat('brick'),mat('brick'),mat('brick'),mat('brick')];
    case 'sand':    return [mat('sand'),mat('sand'),mat('sand'),mat('sand'),mat('sand'),mat('sand')];
    case 'wood':    return [mat('woodPlank'),mat('woodPlank'),mat('woodPlank'),mat('woodPlank'),mat('woodPlank'),mat('woodPlank')];
    case 'leaf':    return [mat('leaf'),mat('leaf'),mat('leaf'),mat('leaf'),mat('leaf'),mat('leaf')];
    case 'bedrock': return [mat('bedrock'),mat('bedrock'),mat('bedrock'),mat('bedrock'),mat('bedrock'),mat('bedrock')];
    default:        return [mat('stone'),mat('stone'),mat('stone'),mat('stone'),mat('stone'),mat('stone')];
  }
}

// ─── APP INIT ────────────────────────────────────────────────────────────────
var renderer, scene, camera;
var voxelData = {}, voxelMesh = {};
var xrSession = null, xrRefSpace = null;
var scanning = true, depthOK = false;
var lastScan = 0, frameN = 0, lastFpsT = 0;
var demoLoop = null;

var VOXEL   = 0.20;   // 20 cm
var MAX_V   = 5000;
var MAX_D   = 5.0;    // max depth metres
var D_SKIP  = 5;      // depth sample stride (pixels)
var SCAN_MS = 80;

function vkey(ix,iy,iz){ return ix+'_'+iy+'_'+iz; }
function w2i(wx,wy,wz){ return [Math.round(wx/VOXEL), Math.round(wy/VOXEL), Math.round(wz/VOXEL)]; }
function i2w(ix,iy,iz){ return new THREE.Vector3(ix*VOXEL, iy*VOXEL, iz*VOXEL); }

function blockType(ix,iy,iz) {
  return voxelData[vkey(ix,iy+1,iz)] ? 'stone' : 'grass';
}

var blockGeo;
function addVoxel(wx,wy,wz) {
  var count = Object.keys(voxelData).length;
  if (count >= MAX_V) return;
  var idx = w2i(wx,wy,wz);
  var ix=idx[0], iy=idx[1], iz=idx[2];
  var k = vkey(ix,iy,iz);
  if (voxelData[k]) return;
  voxelData[k] = true;
  var mesh = new THREE.Mesh(blockGeo, blockMats(blockType(ix,iy,iz)));
  mesh.position.copy(i2w(ix,iy,iz));
  scene.add(mesh);
  voxelMesh[k] = mesh;
  // update block below (might become stone)
  var bk = vkey(ix,iy-1,iz);
  if (voxelMesh[bk]) voxelMesh[bk].material = blockMats(blockType(ix,iy-1,iz));
  document.getElementById('block-count').textContent = count + 1;
}

function clearVoxels() {
  for (var k in voxelMesh) { scene.remove(voxelMesh[k]); }
  voxelData = {}; voxelMesh = {};
  document.getElementById('block-count').textContent = '0';
}

// ─── MAIN INIT ───────────────────────────────────────────────────────────────
function initApp() {
  // Build textures
  buildTextures();

  // Three.js
  var canvas = document.getElementById('main-canvas');
  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x87CEEB, 12, 30);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.01, 60);
  camera.position.set(0, 1.6, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var sun = new THREE.DirectionalLight(0xFFF5E0, 0.6);
  sun.position.set(5, 8, 3); scene.add(sun);
  var fill = new THREE.DirectionalLight(0xB0C8FF, 0.25);
  fill.position.set(-3, 1, -4); scene.add(fill);

  blockGeo = new THREE.BoxGeometry(VOXEL, VOXEL, VOXEL);

  // Clouds on start screen
  makeClouds();

  // Compat check (async)
  checkCompat();

  // Resize
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Buttons
  document.getElementById('btn-start').addEventListener('click', startAR);
  document.getElementById('btn-demo').addEventListener('click', startDemo);
  document.getElementById('btn-toggle').addEventListener('click', toggleScan);
  document.getElementById('btn-clear').addEventListener('click', clearVoxels);
  document.getElementById('btn-exit').addEventListener('click', function() { if(xrSession) xrSession.end(); });
  document.getElementById('btn-err-back').addEventListener('click', function() { document.getElementById('error-screen').style.display='none'; });
}

// ─── COMPAT CHECK ────────────────────────────────────────────────────────────
function checkCompat() {
  var lines = ['✅ 3Dエンジン OK'];
  if (!navigator.xr) {
    lines.push('❌ WebXR 非対応');
    lines.push('Safari 15.4+ が必要です');
    setCompat(lines.join('<br>'));
    return;
  }
  lines.push('✅ WebXR あり');
  navigator.xr.isSessionSupported('immersive-ar').then(function(ok) {
    lines.push(ok ? '✅ AR 対応' : '❌ AR 非対応 (Safari で開いてください)');
    setCompat(lines.join('<br>'));
  }).catch(function(e) {
    lines.push('⚠ AR 確認失敗: ' + e.message);
    setCompat(lines.join('<br>'));
  });
}

// ─── AR SESSION ──────────────────────────────────────────────────────────────
function startAR() {
  if (!navigator.xr) { showError('WebXR が非対応です。\nSafari 15.4+ でお試しください。'); return; }

  navigator.xr.isSessionSupported('immersive-ar').then(function(ok) {
    if (!ok) { showError('AR セッション非対応です。\niPhone 12+ の Safari で\nお試しください。'); return; }

    // First try with depth-sensing optional
    navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['depth-sensing'],
      depthSensing: {
        usagePreference: ['cpu-optimized'],
        dataFormatPreference: ['luminance-alpha'],
      }
    }).catch(function() {
      // Fallback: no depth sensing
      return navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['local-floor']
      });
    }).then(function(session) {
      onSessionStart(session);
    }).catch(function(e) {
      showError('AR 開始エラー:\n' + e.message);
    });
  }).catch(function(e) {
    showError('AR 確認エラー:\n' + e.message);
  });
}

function onSessionStart(session) {
  xrSession = session;
  depthOK = !!(session.depthUsage);

  renderer.xr.setReferenceSpaceType('local-floor');
  renderer.xr.setSession(session).then(function() {
    session.requestReferenceSpace('local-floor').catch(function() {
      return session.requestReferenceSpace('local');
    }).then(function(refSpace) {
      xrRefSpace = refSpace;
      session.addEventListener('end', onSessionEnd);

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'block';

      var badge = document.getElementById('lidar-badge');
      badge.textContent = depthOK ? '✓ LiDAR 有効 — スキャン中' : '⚠ LiDAR 無効 (非対応機種)';
      badge.style.color  = depthOK ? '#5EE' : '#FA5';

      renderer.setAnimationLoop(onXRFrame);
    });
  });
}

// Reusable math objects
var _m4a = new THREE.Matrix4();
var _m4b = new THREE.Matrix4();
var _v4  = new THREE.Vector4();
var _v3  = new THREE.Vector3();

function processDepth(depthInfo, view) {
  var dw = depthInfo.width, dh = depthInfo.height;
  _m4a.fromArray(view.projectionMatrix).invert();   // inv projection
  _m4b.fromArray(view.transform.matrix);            // view → world

  for (var py = 0; py < dh; py += D_SKIP) {
    for (var px = 0; px < dw; px += D_SKIP) {
      var u = (px + 0.5) / dw;
      var v = (py + 0.5) / dh;
      var depth = depthInfo.getDepthInMeters(u, v);
      if (!isFinite(depth) || depth < 0.15 || depth > MAX_D) continue;

      // NDC → view-space direction
      var ndcX =  u * 2 - 1;
      var ndcY = -(v * 2 - 1);
      _v4.set(ndcX, ndcY, -1, 1).applyMatrix4(_m4a);
      _v3.set(_v4.x/_v4.w, _v4.y/_v4.w, _v4.z/_v4.w).normalize().multiplyScalar(depth);

      // View → world
      _v4.set(_v3.x, _v3.y, _v3.z, 1).applyMatrix4(_m4b);
      addVoxel(_v4.x, _v4.y, _v4.z);
    }
  }
  document.getElementById('depth-val').textContent = depthInfo.getDepthInMeters(0.5, 0.5).toFixed(2);
}

function onXRFrame(time, frame) {
  frameN++;
  if (time - lastFpsT > 1000) {
    document.getElementById('fps-val').textContent = frameN;
    frameN = 0; lastFpsT = time;
  }
  if (!frame) { renderer.render(scene, camera); return; }

  var pose = frame.getViewerPose(xrRefSpace);
  if (!pose) { renderer.render(scene, camera); return; }

  if (scanning && depthOK && (time - lastScan) > SCAN_MS) {
    lastScan = time;
    var views = pose.views;
    for (var i = 0; i < views.length; i++) {
      var di = frame.getDepthInformation && frame.getDepthInformation(views[i]);
      if (di) processDepth(di, views[i]);
    }
  }
  renderer.render(scene, camera);
}

function onSessionEnd() {
  xrSession = null;
  renderer.setAnimationLoop(null);
  document.getElementById('hud').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

function toggleScan() {
  scanning = !scanning;
  document.getElementById('btn-toggle').textContent  = scanning ? '停止' : '再開';
  document.getElementById('status-bar').textContent  = scanning ? 'スキャン中...' : '一時停止';
}

// ─── DEMO MODE ───────────────────────────────────────────────────────────────
function startDemo() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('lidar-badge').textContent = '🎮 デモモード';
  document.getElementById('lidar-badge').style.color = '#FF5';
  document.getElementById('status-bar').textContent  = 'デモ表示中';
  document.getElementById('btn-toggle').style.display = 'none';

  camera.position.set(0, 1.4, 2.4);
  camera.lookAt(0, 0, 0);

  // Ground plane 7×7
  for (var x=-3; x<=3; x++) for (var z=-3; z<=3; z++) addVoxel(x*VOXEL, 0, z*VOXEL);
  // Hills
  [[1,1,1],[1,2,1],[2,1,1],[-2,1,-1],[-2,2,-1],[0,1,-2],[0,2,-2],[0,3,-2]].forEach(function(p){
    addVoxel(p[0]*VOXEL, p[1]*VOXEL, p[2]*VOXEL);
  });

  var angle = 0;
  function loop() {
    angle += 0.004;
    camera.position.set(Math.sin(angle)*3.5, 1.6, Math.cos(angle)*3.5);
    camera.lookAt(0, 0.2, 0);
    renderer.render(scene, camera);
    if (!xrSession) demoLoop = requestAnimationFrame(loop);
  }
  demoLoop = requestAnimationFrame(loop);

  // Exit demo
  document.getElementById('btn-exit').addEventListener('click', function exitDemo() {
    if (demoLoop) { cancelAnimationFrame(demoLoop); demoLoop = null; }
    clearVoxels();
    document.getElementById('hud').style.display = 'none';
    document.getElementById('start-screen').style.display = 'flex';
    document.getElementById('btn-toggle').style.display = '';
    document.getElementById('btn-exit').removeEventListener('click', exitDemo);
  }, { once: true });
}

// ─── PIXEL CLOUDS ────────────────────────────────────────────────────────────
function makeClouds() {
  var cont = document.getElementById('cloud-container');
  for (var i = 0; i < 6; i++) {
    var el = document.createElement('div');
    var w = 48 + Math.random()*90, h = 18 + Math.random()*22;
    el.className = 'cloud';
    el.style.cssText = 'width:'+w+'px;height:'+h+'px;top:'+(Math.random()*50)+'%;'
      +'left:'+(Math.random()*100)+'%;'
      +'animation:cloudMove '+(18+Math.random()*22)+'s linear infinite;'
      +'animation-delay:-'+(Math.random()*22)+'s;';
    cont.appendChild(el);
  }
}
</script>
